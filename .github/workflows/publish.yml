name: Publish to npm

# Publishes with npm Trusted Publishing (OIDC): no long-lived npm token is
# stored in this repository.
#
# One-time setup on npmjs.com (after the package exists):
#   Package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user : GamingNowEdward
#     Repository           : opencode-usage-limits
#     Workflow filename    : publish.yml
#     Allowed actions      : allow "npm publish"
#
# Then releasing is just:
#   npm version patch --no-git-tag-version   # or edit package.json
#   git commit -am "chore: release vX.Y.Z"
#   git tag vX.Y.Z && git push origin main --tags

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # Required: lets the workflow create the GitHub Release for the tag.
  contents: write
  # Required: lets the runner mint the OIDC token that npm exchanges for a
  # short-lived publish credential.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in release builds.
          package-manager-cache: false

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json version: $pkg"
          echo "tag version:          $tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Publish
        run: npm publish

      # Create the Release after a successful publish, never before. Existing
      # Releases are left alone so hand-written notes are not overwritten.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it unchanged"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
